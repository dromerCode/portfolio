server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* \.(woff2|pdf|jpg|jpeg|png|webp|avif|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Sin versión en los nombres: el navegador revalida (ETag) para no servir CSS/JS viejo tras un deploy
    location ~* \.(css|js|json)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
