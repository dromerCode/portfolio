services:
  portfolio:
    image: nginx:alpine
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "8099:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Despliega site/ desde GitHub cuando el CI de main pasa (ver deployer.sh)
  deployer:
    image: alpine:3
    container_name: portfolio-deployer
    restart: unless-stopped
    # Mismo usuario que es dueño de site/ en el servidor (picha:samba), para que deploy.sh pueda seguir escribiendo
    user: "999:1000"
    command: ["sh", "/deployer.sh"]
    volumes:
      - ./site:/site
      - ./deployer.sh:/deployer.sh:ro
      - ./.deployer:/state
